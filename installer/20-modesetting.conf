# THE LIVE MEDIUM'S X CONFIG. Software rendering, deliberately.
#
# ⛔ glamor ON nv30 LEAKS PIXMAPS UNTIL THE MACHINE IS OUT OF MEMORY, and the
# installer's own copy is the workload that proves it. Measured on the reference
# machine 2026-09-09, four runs, one variable at a time:
#
#   glamor, 2 GB zram            OOM at 270 s — rsync asks, the killer takes Xorg
#   glamor, 7.8 GB zram          Xorg SIGSEGV at 392 s, address 0x10, in
#                                glamor_create_pixmap -> libgallium (nv30)
#   glamor, 128 MiB GART         OOM at 639 s
#   glamor, both of the above    no OOM, no crash — Xorg spins in nv30 forever
#                                at 100% of a core, desktop frozen, mouse alive
#   AccelMethod "none"           ✅ COMPLETED in 846 s, everything else stock
#
# Peak Shmem tells the whole story: 481 MB, and gigabytes more pushed into swap,
# against **11 MB** with glamor off. Peak swap use went from 3044 MB to 1 MB.
# The pixmaps compressed 11.8:1 because they are overwhelmingly zeros — that is
# not a working set, it is a leak. More swap and a smaller GART each bought time
# (270 s → 392 s → 639 s) and neither stopped it; they only changed whether the
# ending was an OOM kill, a null dereference or an infinite loop.
#
# ⚠ SO THIS IS THE LIVE MEDIUM ONLY, AND IT IS NOT WHAT AN INSTALLED SYSTEM
# WANTS. A desktop wants the acceleration; the bug needs sustained allocation to
# bite, which ordinary use does not do. ember-install REPLACES this file on the
# target with 20-modesetting-installed.conf, which turns glamor back on — see
# installer/ember-install. Do not "fix" the divergence by making them the same.
#
# ⚠ The cost here is real and visible: the live desktop is CPU-drawn, so dragging
# and scrolling hitch. That is the trade for an installer that finishes.
#
# ⛔ Still modesetting and NOT the legacy nouveau DDX either way. Xorg
# autoconfigures `nouveau` first on an NVIDIA card, and that driver is
# deprecated and DRI2-only — "screen 0 does not appear to be DRI3 capable" —
# which costs a great deal of redundant buffer copying.
Section "Device"
    Identifier "nvidia-kms"
    Driver "modesetting"
    Option "AccelMethod" "none"
    Option "DRI" "3"
EndSection
