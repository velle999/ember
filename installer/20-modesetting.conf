# modesetting + glamor, on both the live medium and the installed system.
#
# ⛔ modesetting AND NOT THE LEGACY nouveau DDX. Xorg autoconfigures `nouveau`
# first on an NVIDIA card, and that driver is deprecated and DRI2-only: "screen
# 0 does not appear to be DRI3 capable". The result is a great deal of redundant
# buffer copying, which presents as a laggy cursor and hitching menus on
# hardware that is otherwise perfectly capable — a 1999 game on a 2006 card.
#
# With this, Xorg reports:
#     modeset(0): glamor X acceleration enabled on NV4B
#
# ⛔ AND THIS FILE IS ONLY SAFE BECAUSE MESA CARRIES
# patches/mesa-nv30-surface-del-leaks-resource-ref.patch. Without it, glamor on
# nv30 leaks a miptree reference per render target surface and the X server
# grows about 38 MB/s whenever anything animates — the installer's own 5 GB copy
# killed the session in under five minutes, and a blank screensaver did it in
# two. An image built with stock Mesa and this config has a graphical installer
# that cannot finish. mkrootfs.sh names the Mesa revision in its patched-package
# report for exactly this reason; a ⚠ STOCK line there means do not ship it.
#
# ⚠ THE LIVE MEDIUM SHIPPED AccelMethod "none" FOR ONE RELEASE, as a workaround
# while that leak was open. It is back to glamor because the leak is fixed at
# the source, and because a workaround kept past its bug is how a tree collects
# things nobody dares remove. Measured on the reference GeForce 7600 with the
# fix in place: the installer's own workload — rsync --info=progress2 redrawing
# in a terminal while 9.1 GB copied, 312 seconds — moved Shmem by 2 MB. The
# screensaver that used to kill the session in two minutes moves it by nothing.
#
# ⚠ If the leak ever returns, "none" here is the switch, and it costs only
# rendering speed on the medium it is set for.
Section "Device"
    Identifier "nvidia-kms"
    Driver "modesetting"
    Option "AccelMethod" "glamor"
    Option "DRI" "3"
EndSection
