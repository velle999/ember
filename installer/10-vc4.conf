# The display is card1 (vc4); card0 is v3d, which is render-only and has no
# connectors, so X autoconfiguring by device number picks the one it cannot
# display on. Naming vc4 as the primary GPU is what Raspberry Pi OS does too.
Section "OutputClass"
    Identifier  "vc4"
    MatchDriver "vc4"
    Driver      "modesetting"
    Option      "PrimaryGPU" "true"
EndSection
