# THE INSTALLED SYSTEM'S X CONFIG. glamor on, unlike the live medium's.
#
# ⚠ THIS FILE IS NOT USED WHERE IT SITS. It travels in the image at
# /usr/share/ember/20-modesetting-installed.conf and ember-install copies it
# over the target's /etc/X11/xorg.conf.d/20-modesetting.conf after the rsync —
# because the rsync copies the LIVE medium's config, which disables
# acceleration, and an installed desktop should not inherit that.
#
# ⛔ modesetting + glamor, NOT the legacy nouveau DDX. Xorg autoconfigures
# `nouveau` first on an NVIDIA card, and that driver is deprecated and DRI2-only:
# "screen 0 does not appear to be DRI3 capable". The result is a great deal of
# redundant buffer copying, which presents as a laggy cursor and hitching menus
# on hardware that is otherwise perfectly capable — a 1999 game on a 2006 card.
#
# With this, Xorg reports:
#     modeset(0): glamor X acceleration enabled on NV4B
# which is the same GPU doing the same work down a much shorter path.
#
# ⚠ AND IT CARRIES A KNOWN, OPEN BUG WITH IT. glamor on nv30 leaks pixmaps under
# sustained allocation — see 20-modesetting.conf for the four measured runs. An
# ordinary desktop does not hit it; the installer's 5.2 GB copy does, every time.
# If a long-running workload on an installed machine ever presents as a freeze
# with a live mouse cursor, that is this, and this file is the switch.
Section "Device"
    Identifier "nvidia-kms"
    Driver "modesetting"
    Option "AccelMethod" "glamor"
    Option "DRI" "3"
EndSection
